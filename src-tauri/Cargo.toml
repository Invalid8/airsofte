[package]
name = "airsofte"
version = "1.1.5"
description = "A retro shooter game"
authors = ["dalgoridim <b.fadamitan2019@gmail.com>"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
